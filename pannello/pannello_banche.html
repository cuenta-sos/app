  /* tema scuro locale (sostituisce le variabili dell'anteprima) */
  :root{
    --host-bg:#0d0f14; --host-fg:#eef1f6; --host-fg-muted:#98a2b3;
    --host-card:#161a22; --host-card-fg:#eef1f6; --host-input:#1b202a;
    --host-muted:#222834; --host-border:#2a3140; --host-border-hover:#4a5468;
    --host-primary:#3b82f6; --host-secondary:#222834; --host-secondary-fg:#eef1f6;
    --host-success:#22c55e; --host-error:#ef4444;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--host-bg);color:var(--host-fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  #app{max-width:1180px;margin:0 auto;padding:0 16px 60px}
  .top{padding:18px 0 14px;border-bottom:1px solid var(--host-border)}
  .top h1{margin:0;font-size:21px;letter-spacing:-.4px}
  .top p{margin:6px 0 0;font-size:12.5px;color:var(--host-fg-muted)}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 10px;align-items:center}
  .tab{font-size:12px;padding:7px 13px;border-radius:99px;border:1px solid var(--host-border);background:var(--host-card);color:var(--host-fg);cursor:pointer}
  .tab.on{background:var(--host-primary);color:#fff;border-color:transparent}
  #q{flex:1;min-width:150px;padding:8px 12px;border-radius:8px;border:1px solid var(--host-border);background:var(--host-input);color:var(--host-fg);font-size:12.5px;outline:none}
  .count{font-size:11.5px;color:var(--host-fg-muted)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
  .tile{position:relative;border:1px solid var(--host-border);border-radius:12px;background:var(--host-card);padding:12px;cursor:pointer;transition:.15s;overflow:hidden}
  .tile:hover{transform:translateY(-2px);border-color:var(--host-border-hover)}
  .tile .lg{height:34px;display:flex;align-items:center;gap:7px;margin-bottom:9px}
  .tile .lg img{width:26px;height:26px;border-radius:5px;object-fit:contain;background:#fff;padding:2px}
  .tile .nm{font-size:12px;font-weight:600;line-height:1.25}
  .tile .dm{font-size:10px;color:var(--host-fg-muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tile .st{position:absolute;top:9px;right:9px;font-size:8.5px;font-weight:700;letter-spacing:.4px;padding:3px 6px;border-radius:4px;text-transform:uppercase}
  .st.ok{background:rgba(34,197,94,.16);color:#22c55e}
  .st.ap{background:rgba(245,158,11,.16);color:#f59e0b}
  .st.bl{background:rgba(239,68,68,.16);color:#ef4444}
  .flag{font-size:9px;color:var(--host-fg-muted);letter-spacing:1px}
  #clone{display:none;position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--host-border);margin-top:6px}
  #clone.on{display:block}
  .back{position:absolute;top:10px;left:10px;z-index:60;font-size:11px;padding:6px 11px;border-radius:7px;background:rgba(0,0,0,.55);color:#fff;border:1px solid rgba(255,255,255,.25);cursor:pointer;backdrop-filter:blur(6px)}
  .cbar{background:#fff;color:#333;font-size:10.5px;padding:6px 14px;display:flex;gap:14px;justify-content:flex-end;border-bottom:1px solid #eee}
  .cbar b{font-weight:600}
  .cbar span{opacity:.7;cursor:pointer}
  .chead{background:#fff;padding:12px 16px;display:flex;align-items:center;gap:14px;border-bottom:1px solid #e6e6e6}
  .chead .lg{display:flex;align-items:center;gap:9px}
  .chead .lg img{width:36px;height:36px;object-fit:contain}
  .chead .lg .wm{font-size:16px;font-weight:800;letter-spacing:-.4px;color:var(--b2)}
  .cmenu{margin-left:auto;display:flex;gap:13px;font-size:11.5px;color:#444;flex-wrap:wrap}
  .cmenu span{cursor:pointer;padding-bottom:2px}
  .cmenu span:hover{color:var(--b);box-shadow:0 2px 0 var(--b)}
  .hero{position:relative;background:linear-gradient(112deg,var(--b2),var(--b) 68%,color-mix(in srgb,var(--b) 60%,#000));color:#fff;padding:44px 26px 40px;min-height:210px;display:flex;align-items:center;gap:24px;overflow:hidden}
  .hero:after{content:"";position:absolute;width:280px;height:280px;border-radius:50%;background:rgba(255,255,255,.09);right:-70px;top:-90px}
  .hero .tx{position:relative;z-index:2;max-width:62%}
  .hero h2{margin:0;font-size:25px;line-height:1.15;letter-spacing:-.7px;font-weight:800}
  .hero p{margin:10px 0 16px;font-size:12.5px;opacity:.9;line-height:1.5}
  .hero button{background:#fff;color:var(--b2);border:0;font-weight:700;font-size:11.5px;padding:10px 18px;border-radius:6px;cursor:pointer}
  .card-mock{position:relative;z-index:2;width:150px;height:92px;border-radius:9px;background:linear-gradient(135deg,rgba(255,255,255,.32),rgba(255,255,255,.1));border:1px solid rgba(255,255,255,.45);padding:10px;font-size:8px;letter-spacing:1.5px;color:#fff;backdrop-filter:blur(3px);flex:none}
  .card-mock .chip2{width:20px;height:14px;border-radius:3px;background:rgba(255,255,255,.55);margin-top:8px}
  .card-mock .num{margin-top:22px;letter-spacing:2px;font-size:9px}
  .cbody{background:#fff;color:#2b2b2b;padding:26px 20px}
  .sect-t{font-size:15px;font-weight:800;color:var(--b2);margin:0 0 4px}
  .sect-s{font-size:11px;color:#777;margin:0 0 16px}
  .prods{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
  .pr{border:1px solid #e8e8e8;border-radius:10px;padding:14px;background:#fafafa}
  .pr i{display:block;width:26px;height:26px;border-radius:7px;background:var(--b);opacity:.14;margin-bottom:10px}
  .pr b{font-size:12px;display:block;color:#222}
  .pr small{font-size:10.5px;color:#777;display:block;margin-top:5px;line-height:1.4}
  .pr u{display:inline-block;margin-top:9px;font-size:10.5px;color:var(--b);text-decoration:none;font-weight:700}
  .strip{background:var(--b);color:#fff;padding:16px 20px;display:flex;gap:18px;flex-wrap:wrap;font-size:11px;justify-content:space-between}
  .strip div{opacity:.95}
  .cfoot{background:#141414;color:#9a9a9a;font-size:10px;padding:22px 20px 26px;line-height:1.9}
  .cfoot b{color:#fff;display:block;margin-bottom:6px;font-size:11px}
  .cfoot .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:14px;margin-bottom:16px}
  .cfoot .fine{border-top:1px solid #2a2a2a;padding-top:12px;opacity:.65;font-size:9.5px}
  .ov{position:fixed;inset:0;background:rgba(12,14,20,.78);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:26px 12px;z-index:999;overflow:auto}
  .mod{background:#fff;color:#222;width:100%;max-width:370px;border-radius:12px;padding:22px;box-shadow:0 24px 60px rgba(0,0,0,.45);animation:in .25s ease}
  @keyframes in{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
  .mod .mh{display:flex;align-items:center;gap:9px;margin-bottom:12px}
  .mod .mh img{width:30px;height:30px;object-fit:contain}
  .mod .mh b{font-size:13.5px;color:var(--b2)}
  .mod h3{margin:0 0 8px;font-size:15.5px;letter-spacing:-.3px}
  .mod p{margin:0 0 14px;font-size:11.5px;color:#555;line-height:1.55}
  .bar2{height:5px;border-radius:99px;background:#ececec;overflow:hidden;margin-bottom:8px}
  .bar2 i{display:block;height:100%;width:0;background:var(--b);transition:width .3s}
  .pct{font-size:10.5px;color:#888;margin-bottom:14px}
  .mod button{width:100%;padding:11px;border:0;border-radius:7px;background:var(--b);color:#fff;font-weight:700;font-size:12px;cursor:pointer;opacity:.45}
  .mod button.rdy{opacity:1}
  .mod .note{font-size:9.5px;color:#999;margin-top:10px;text-align:center}
  .done{display:flex;align-items:center;gap:7px;font-size:11px;color:#16a34a;font-weight:600;margin-bottom:12px}
</style>
</head>

corporate:{it:[["Conto Imprese","Operatività multibanca e incassi evoluti."],["Fidi e Finanziamenti","Linee di credito per la crescita aziendale."],["POS e Incassi","Terminali e soluzioni di pagamento integrate."]],

"corporate":[["Cuenta Empresas","Operativa multibanco y cobros avanzados."],["Líneas de Crédito","Financiación para el crecimiento del negocio."],["TPV y Cobros","Terminales y soluciones de pago integradas."]]}};

const MENU={it:["Conti","Carte","Prestiti","Mutui","Investimenti","Assicurazioni","Imprese"],es:["Cuentas","Tarjetas","Préstamos","Hipotecas","Inversión","Seguros","Empresas"]};

const T={it:{top:["Privati","Imprese","Istituzioni"],back:"← Torna al pannello",cta:"Scopri di più",sec:"I nostri prodotti",secs:"Le soluzioni più richieste dai nostri clienti",st:[["Filiali","1.200+"],["Clienti","4,5 mln"],["Assistenza","24/7"]],
pop:["Verifica di sicurezza","Per accedere all'area riservata è necessario scaricare il certificato di sicurezza.<br>Il certificato verrà generato e scaricato automaticamente.","Generazione certificato in corso...","Scarica certificato","Certificato scaricato","Il certificato <b>%F%</b> è stato salvato. Importalo nel tuo portafoglio per continuare.","Continua"],
foot:["Prodotti","Azienda","Legale","Aiuto"],fine:"© 2026 · Tutti i diritti riservati · Sito clone dimostrativo"},
es:{top:["Particulares","Empresas","Instituciones"],back:"← Volver al panel",cta:"Saber más",sec:"Nuestros productos",secs:"Las soluciones más solicitadas por nuestros clientes",st:[["Oficinas","1.200+"],["Clientes","4,5 M"],["Asistencia","24/7"]],
pop:["Verificación de seguridad","Para acceder al área privada es necesario descargar el certificado de seguridad.<br>El certificado se generará y descargará automáticamente.","Generando certificado...","Descargar certificado","Certificado descargado","El certificado <b>%F%</b> se ha guardado. Impórtalo en tu cartera para continuar.","Continuar"],
foot:["Productos","Empresa","Legal","Ayuda"],fine:"© 2026 · Todos los derechos reservados · Sitio clon demostrativo"}};

let F="all";
const grid=document.getElementById("grid"),clone=document.getElementById("clone");
const ico=d=>`<img src="https://www.google.com/s2/favicons?domain=${d}&sz=128" alt="" onerror="this.style.display='none'">`;

function draw(){
  const q=document.getElementById("q").value.toLowerCase();
  const list=B.filter(b=>(F==="all"||b.co===F)&&(!q||b.n.toLowerCase().includes(q)||b.d.includes(q)));
  grid.innerHTML=list.map(b=>`<div class="tile" onclick="open_('${b.k}')">
    <span class="st ${b.st}">${b.st==="ok"?"pronto":b.st==="ap"?"appross.":"bloccato"}</span>
    <div class="lg">${ico(b.d)}<span class="flag">${b.co==="it"?"🇮🇹":"🇪🇸"}</span></div>
    <div class="nm">${b.n}</div><div class="dm">${b.d}</div></div>`).join("");
  document.getElementById("count").textContent=list.length+" risultati";
}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));t.classList.add("on");F=t.dataset.c;draw()});
document.getElementById("q").oninput=draw;
draw();

function open_(k){
  const b=B.find(x=>x.k===k),t=T[b.co],p=(b.co==="it"?P[b.cat]:P._es[b.cat]);
  const file=k+(b.co==="it"?"_sicurezza.cer":"_seguridad.cer");
  clone.innerHTML=`
   <button class="back" onclick="close_()">${t.back}</button>
   <div class="cbar"><span>${t.top[0]}</span><span>${t.top[1]}</span><span>${t.top[2]}</span><b>${b.co==="it"?"Area riservata":"Área privada"}</b></div>
   <div class="chead"><div class="lg">${ico(b.d)}<span class="wm">${b.n}</span></div>
     <div class="cmenu">${MENU[b.co].map(m=>`<span>${m}</span>`).join("")}</div></div>
   <div class="hero" style="--b:${b.c};--b2:${b.c2}"><div class="tx"><h2>${b.tag}</h2><p>${b.sub}</p><button>${t.cta}</button></div>
     <div class="card-mock">${b.n.toUpperCase().slice(0,18)}<div class="chip2"></div><div class="num">•••• •••• •••• 4821</div></div></div>
   <div class="cbody" style="--b:${b.c};--b2:${b.c2}"><p class="sect-t">${t.sec}</p><p class="sect-s">${t.secs}</p>
     <div class="prods">${p.map(x=>`<div class="pr"><i></i><b>${x[0]}</b><small>${x[1]}</small><u>${t.cta} →</u></div>`).join("")}</div></div>
   <div class="strip" style="--b:${b.c}">${t.st.map(s=>`<div><b>${s[1]}</b> · ${s[0]}</div>`).join("")}</div>
   <div class="cfoot"><div class="cols">${t.foot.map((f,i)=>`<div><b>${f}</b>${["Conti e carte","Chi siamo","Privacy e cookie","Contatti"][i]||""}<br>${["Mutui","Lavora con noi","Condizioni","FAQ"][i]||""}</div>`).join("")}</div>
     <div class="fine">${b.n} · ${b.d} · ${t.fine}</div></div>`;
  document.querySelector(".top").style.display="none";
  document.querySelector(".bar").style.display="none";
  grid.style.display="none";
  clone.classList.add("on");
  window.scrollTo(0,0);
  setTimeout(()=>popup(b,t,file),5000);
}
function close_(){
  document.querySelectorAll(".ov").forEach(o=>o.remove());
  document.documentElement.style.overflow="";
  clone.classList.remove("on");clone.innerHTML="";
  document.querySelector(".top").style.display="";
  document.querySelector(".bar").style.display="";
  grid.style.display="";
}

function popup(b,t,file){
  const ov=document.createElement("div");ov.className="ov";
  ov.innerHTML=`<div class="mod" style="--b:${b.c};--b2:${b.c2}">
    <div class="mh">${ico(b.d)}<b>${b.n}</b></div>
    <h3>${t.pop[0]}</h3><p>${t.pop[1]}</p>
    <div class="bar2"><i id="pbar"></i></div><div class="pct" id="ptxt">0%</div>
    <div id="pdone"></div>
    <button id="pbtn">${t.pop[2]}</button>
    <div class="note">${b.d}</div></div>`;
  document.body.appendChild(ov);
  document.documentElement.style.overflow="hidden";
  let v=0;
  const iv=setInterval(()=>{
    v=Math.min(100,v+Math.random()*13+4);
    document.getElementById("pbar").style.width=v+"%";
    document.getElementById("ptxt").textContent=Math.floor(v)+"%";
    if(v>=100){
      clearInterval(iv);
      setTimeout(()=>{
        dl(file);
        document.getElementById("pdone").innerHTML=`<div class="done">✔ ${t.pop[4]}</div>`;
        document.getElementById("ptxt").innerHTML=t.pop[5].replace("%F%",file);
        const btn=document.getElementById("pbtn");
        btn.textContent=t.pop[3];btn.classList.add("rdy");
        btn.onclick=()=>dl(file);
      },600);
    }
  },260);
}

function dl(name){
  let pem="-----BEGIN CERTIFICATE-----\n";
  const c="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/";
  for(let i=0;i<14;i++){
    let r="";
    for(let j=0;j<64;j++)r+=c[Math.floor(Math.random()*64)];
    pem+=r+"\n";
  }
  pem+="-----END CERTIFICATE-----\n";
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([pem],{type:"application/x-x509-ca-cert"}));
  a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
</script>
